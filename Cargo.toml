[package]
name = "swarm"
version = "0.0.9"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
copypasta = "0.10.2"
dirs = "6.0.0"
dunce = "1.0.5"
egui = "0.34.2"
eframe = "0.34.2"
git2 = "0.20.4"
globset = "0.4.18"
grep-matcher = "0.1.8"
grep-regex = "0.1.14"
grep-searcher = "0.1.16"
humansize = "2.1.3"
image = { version = "0.25.10", default-features = false, features = ["ico", "png"] }
ignore = "0.4.25"
memchr = "2.8.0"
mimalloc = { version = "0.1.50", default-features = false }
rayon = "1.12"
rustc-hash = "2.1.2"
single-instance = "0.3.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rfd = "0.17.2"
toml = "1.1.2"
tree-sitter = "0.26.8"
tree-sitter-css = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-zig = "1.1.2"
uuid = { version = "1.23.1", features = ["v4"] }

[build-dependencies]
winres = "0.1.12"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3.9", features = ["consoleapi", "processenv", "winbase", "windef", "wincon", "winuser"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25.0"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "swarm-gui"
path = "src/main.rs"

[[bin]]
name = "swarm-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "swarm-full"
path = "src/bin/full.rs"
