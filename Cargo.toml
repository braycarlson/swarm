[package]
name = "swarm"
version = "0.0.9"
edition = "2024"
license = "MIT"
repository = "https://github.com/braycarlson/swarm"
description = "A developer tool for generating project context"
keywords = ["clipboard", "context", "llm", "source", "tree"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[workspace]
members = ["xtask"]

[dependencies]
arboard = { version = "3.6.1", default-features = false }
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
dunce = "1.0.5"
egui = "0.34.2"
eframe = "0.34.2"
git2 = "0.20.4"
globset = "0.4.18"
grep-regex = "0.1.14"
grep-searcher = "0.1.16"
image = { version = "0.25.10", default-features = false, features = ["ico", "png"] }
ignore = "0.4.25"
memchr = "2.8.0"
mimalloc = { version = "0.1.50", default-features = false }
rayon = "1.12"
rfd = "0.17.2"
rustc-hash = "2.1.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
single-instance = "0.3.3"
toml = "1.1.2"
tree-sitter = "0.26.8"
tree-sitter-css = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-zig = "1.1.2"
uuid = { version = "1.23.1", features = ["v4"] }

[dev-dependencies]
criterion = "0.8.2"

[build-dependencies]
winresource = "0.1.31"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["consoleapi", "processenv", "winbase", "wincon"] }
winreg = "0.56.0"

[lints]
workspace = true

[workspace.lints.rust]
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
non_ascii_idents = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -1 }

allow_attributes = "warn"
allow_attributes_without_reason = "warn"

absolute_paths = "allow"
arithmetic_side_effects = "allow"
as_conversions = "allow"
assertions_on_result_states = "allow"
big_endian_bytes = "allow"
blanket_clippy_restriction_lints = "allow"
collapsible_if = "allow"
default_numeric_fallback = "allow"
else_if_without_else = "allow"
exhaustive_enums = "allow"
exhaustive_structs = "allow"
expect_used = "allow"
field_scoped_visibility_modifiers = "allow"
float_arithmetic = "allow"
impl_trait_in_params = "allow"
implicit_return = "allow"
indexing_slicing = "allow"
inline_modules = "allow"
integer_division = "allow"
integer_division_remainder_used = "allow"
let_underscore_must_use = "allow"
let_underscore_untyped = "allow"
little_endian_bytes = "allow"
match_same_arms = "allow"
missing_assert_message = "allow"
missing_const_for_fn = "allow"
missing_docs_in_private_items = "allow"
missing_errors_doc = "allow"
missing_inline_in_public_items = "allow"
missing_panics_doc = "allow"
missing_trait_methods = "allow"
mod_module_files = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
must_use_candidate = "allow"
option_if_let_else = "allow"
panic = "allow"
panic_in_result_fn = "allow"
pattern_type_mismatch = "allow"
print_stderr = "allow"
print_stdout = "allow"
pub_use = "allow"
pub_with_shorthand = "allow"
question_mark_used = "allow"
redundant_closure_for_method_calls = "allow"
redundant_pub_crate = "allow"
renamed_function_params = "allow"
same_name_method = "allow"
semicolon_outside_block = "allow"
separated_literal_suffix = "allow"
should_implement_trait = "allow"
single_call_fn = "allow"
struct_excessive_bools = "allow"
tests_outside_test_module = "allow"
undocumented_unsafe_blocks = "allow"
unreachable = "allow"
unwrap_in_result = "allow"
wildcard_enum_match_arm = "allow"

[profile.release]
codegen-units = 1
debug-assertions = true
lto = "fat"
overflow-checks = true
panic = "abort"
strip = true

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"

[[bin]]
name = "swarm-gui"
path = "src/main.rs"

[[bin]]
name = "swarm-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "swarm-full"
path = "src/bin/full.rs"

[[bench]]
name = "swarm"
harness = false
